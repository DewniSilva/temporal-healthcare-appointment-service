name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.19.5, cache: npm }
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: test-secret-at-least-thirty-two-characters
          METRICS_ENABLED: 'false'
      - run: npm run build
      - run: npx prisma validate
        env: { DATABASE_URL: postgresql://test:test@localhost:5432/test }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: healthcare }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d healthcare"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healthcare
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-at-least-thirty-two-characters
      RUN_INTEGRATION_TESTS: 'true'
      METRICS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.19.5, cache: npm }
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate
      - run: npx vitest run tests/integration

  container:
    needs: [backend, frontend, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build each immutable image once
        run: |
          docker build --build-arg VCS_REF="$GITHUB_SHA" --build-arg VERSION="${GITHUB_REF_NAME}" -t "temporal-healthcare-app:ci" .
          docker build --build-arg VCS_REF="$GITHUB_SHA" --build-arg VERSION="${GITHUB_REF_NAME}" -t "temporal-healthcare-frontend:ci" frontend
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: temporal-healthcare-app:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Frontend vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: temporal-healthcare-frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0.17.0
        with: { image: temporal-healthcare-app:ci, artifact-name: backend-sbom.spdx.json }
      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0.17.0
        with: { image: temporal-healthcare-frontend:ci, artifact-name: frontend-sbom.spdx.json }
      - name: Smoke test the exact images
        env: { IMAGE_TAG: ci }
        run: |
          docker compose up -d --no-build --wait
          curl --fail --retry 10 --retry-all-errors http://localhost:3000/liveness
          curl --fail --retry 10 --retry-all-errors http://localhost:3000/readiness
          curl --fail --retry 10 --retry-all-errors http://localhost:8081/health
          docker compose logs worker | grep worker_started
      - name: Publish SHA-addressed images
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry_repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag temporal-healthcare-app:ci "$registry_repo/app:git-$GITHUB_SHA"
          docker tag temporal-healthcare-frontend:ci "$registry_repo/frontend:git-$GITHUB_SHA"
          docker push "$registry_repo/app:git-$GITHUB_SHA"
          docker push "$registry_repo/frontend:git-$GITHUB_SHA"
          docker image inspect "$registry_repo/app:git-$GITHUB_SHA" --format '{{json .RepoDigests}}'
          docker image inspect "$registry_repo/frontend:git-$GITHUB_SHA" --format '{{json .RepoDigests}}'
      - name: Compose diagnostics
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
