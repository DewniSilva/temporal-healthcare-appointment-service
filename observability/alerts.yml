groups:
  - name: healthcare-appointments
    rules:
      - alert: AppointmentApiMetricsUnavailable
        expr: up{job="appointment-api"} == 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Appointment API is unavailable to Prometheus" }
      - alert: AppointmentApiReadinessFailing
        expr: sum(rate(http_requests_total{route="/readiness",status_class="5xx"}[5m])) > 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "API readiness dependency checks are persistently failing; inspect PostgreSQL, Temporal, and Redis status" }
      - alert: TemporalWorkerUnavailable
        expr: up{job="temporal-worker-sdk"} == 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Temporal worker metrics/poller is unavailable" }
      - alert: AppointmentApiHighErrorRate
        expr: sum(rate(http_errors_total[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.01) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "API 5xx error ratio exceeds 5%" }
      - alert: AppointmentApiHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[10m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "API p95 latency exceeds one second" }
      - alert: TemporalWorkflowFailures
        expr: sum(increase(temporal_workflow_failed_total[15m])) > 0
        labels: { severity: warning }
        annotations: { summary: "Temporal workflow failures detected" }
      - alert: TemporalActivityFailures
        expr: sum(increase(temporal_activity_execution_failed_total[15m])) > 5
        labels: { severity: warning }
        annotations: { summary: "Temporal activity failures are elevated" }
      - alert: TemporalTaskQueueLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(temporal_activity_schedule_to_start_latency_seconds_bucket[10m]))) > 5
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Temporal activity schedule-to-start p95 exceeds five seconds" }
      - alert: ReminderFailures
        expr: sum(increase(reminders_failed_total[15m])) > 5
        labels: { severity: warning }
        annotations: { summary: "Reminder delivery failures are elevated" }
      - alert: ReconciliationFailures
        expr: sum(increase(reconciliation_failures_total[15m])) > 0
        labels: { severity: critical }
        annotations: { summary: "Reconciliation activity failed" }
      - alert: ReconciliationRepairSpike
        expr: sum(increase(reconciliation_repairs_total[30m])) > 20
        labels: { severity: warning }
        annotations: { summary: "Reconciliation is finding unusually high drift" }
      - alert: RateLimitStoreErrors
        expr: sum(increase(rate_limit_redis_errors_total[10m])) > 0
        labels: { severity: critical }
        annotations: { summary: "Rate limiter cannot reliably use Redis" }
      - alert: RateLimitBlockingSpike
        expr: sum(rate(rate_limit_blocked_total[5m])) > 1
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Rate-limit blocking has spiked" }
