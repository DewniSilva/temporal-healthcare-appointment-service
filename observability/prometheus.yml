global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: appointment-api
    static_configs: [{ targets: ["backend:9464"] }]
  - job_name: appointment-worker
    static_configs: [{ targets: ["worker:9464"] }]
  - job_name: temporal-worker-sdk
    static_configs: [{ targets: ["worker:9465"] }]

